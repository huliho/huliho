[package]
name = "huliho-imap-bridge"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Tests that need the compose Dovecot.
live-targets = []
# The scripted IMAP and SMTP servers the tests run against.
test-support = ["dep:base64", "dep:rcgen", "tokio/io-util", "tokio/rt"]

[dependencies]
async-channel = "2.5.0"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
base64 = { version = "0.23.1", optional = true }
gethostname = "1.1.0"
mail-send = { version = "0.6.2", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14.10", optional = true }
smtp-proto = "0.2.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["net", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["logging", "ring", "tls12"] }

[dev-dependencies]
huliho-imap-bridge = { version = "0.0.0", path = ".", features = ["test-support"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
