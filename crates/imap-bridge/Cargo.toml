[package]
name = "huliho-imap-bridge"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Tests that need the compose Dovecot.
live-targets = []

[dependencies]
async-channel = "2.5.0"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["net", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["logging", "ring", "tls12"] }

[dev-dependencies]
base64 = "0.23.1"
rcgen = "0.14.10"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
