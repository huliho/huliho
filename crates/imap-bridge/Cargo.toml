[package]
name = "huliho-imap-bridge"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Tests that need the compose Dovecot.
live-targets = []
# The scripted IMAP and SMTP servers the tests run against, the recorder
# and the replayer.
test-support = ["dep:rcgen", "tokio/macros"]

[dependencies]
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
gethostname = "1.1.0"
mail-parser = { version = "0.11.9", default-features = false, features = ["full_encoding"] }
mail-send = { version = "0.6.2", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14.10", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smtp-proto = "0.2.4"
thiserror = "2.0.20"
time = { version = "0.3.55", default-features = false, features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.1", features = ["io-util", "net", "rt", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["logging", "ring", "tls12"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
huliho-imap-bridge = { version = "0.0.0", path = ".", features = ["test-support"] }
insta = { version = "1.48.0", default-features = false, features = ["json"] }
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
webpki-roots = "1.0.9"

[lints]
workspace = true
