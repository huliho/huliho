[package]
name = "huliho-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Tests that need the compose targets and the public internet.
live-targets = []

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base16ct = { version = "1.0.0", features = ["alloc"] }
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hickory-resolver = "0.26.2"
hkdf = "0.13.0"
huliho-imap-bridge = { version = "0.0.0", path = "../imap-bridge" }
ipnet = { version = "2.12.1", features = ["serde"] }
quick-xml = { version = "0.42.0", features = ["overlapped-lists", "serialize"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
rustls = { version = "0.23.43", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.4"
tower-http = { version = "0.7.1", features = ["fs", "request-id", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.0", features = ["v4"] }
webpki-roots = "1.0.9"

[dev-dependencies]
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
http-body-util = "0.1.5"
huliho-imap-bridge = { version = "0.0.0", path = "../imap-bridge", features = ["test-support"] }
rcgen = "0.14.10"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
trybuild = "1.0.120"

[lints]
workspace = true
