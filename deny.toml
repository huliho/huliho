[graph]
# The allowlist binds what ships; dev dependencies stay out of the graph.
exclude-dev = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
]
# Mozilla's root store is data, published under a permissive data license.
exceptions = [
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]
private = { ignore = true }
unused-allowed-license = "allow"

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
