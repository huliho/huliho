# Every quality gate runs here on pull requests and main. Actions are
# pinned to commit SHAs and every job runs with a least-privilege token.

name: ci

on:
  pull_request:
  pull_request_target:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ contains(github.event_name, 'pull_request') }}

env:
  FILE_LINE_CEILING: "400"
  # A version bump needs its checksum updated in the same change.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  js:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: turbo task wiring
        # turbo exits green when a workspace glob or script rename leaves
        # zero tasks, so the tasks that must exist are pinned here.
        run: |
          cat > "$RUNNER_TEMP/wiring.mjs" <<'CHECK'
          import { readFileSync } from "node:fs";
          const expected = [
            "@huliho/i18n#build",
            "@huliho/i18n#test",
            "@huliho/web#build",
            "@huliho/web#build:storybook",
            "@huliho/web#test",
            "@huliho/web#test:e2e",
            "@huliho/web#typecheck",
          ];
          const tasks = JSON.parse(readFileSync(process.argv[process.argv.length - 1], "utf8")).tasks;
          const wired = new Set(tasks.filter((t) => t.command !== "<NONEXISTENT>").map((t) => t.taskId));
          const missing = expected.filter((id) => !wired.has(id));
          for (const id of missing) console.error(`${id} has no script behind it`);
          process.exit(missing.length === 0 ? 0 : 1);
          CHECK
          printf '{"tasks":[{"taskId":"@huliho/web#test","command":"<NONEXISTENT>"}]}' > "$RUNNER_TEMP/unwired.json"
          if node "$RUNNER_TEMP/wiring.mjs" "$RUNNER_TEMP/unwired.json" > /dev/null 2>&1; then
            echo "the wiring check accepted a task without a script"
            exit 1
          fi
          pnpm exec turbo run build build:storybook test test:e2e typecheck --dry=json > "$RUNNER_TEMP/tasks.json"
          node "$RUNNER_TEMP/wiring.mjs" "$RUNNER_TEMP/tasks.json"
      - run: pnpm format
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @huliho/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm --filter @huliho/web lighthouse
      - run: pnpm knip
      - run: pnpm size
      - name: jscpd per package
        run: |
          for dir in apps/* packages/* crates/*; do
            pnpm exec jscpd "$dir"
          done
      - name: production dependency licenses
        run: |
          cat > "$RUNNER_TEMP/licenses.mjs" <<'CHECK'
          import { readFileSync } from "node:fs";
          const allowed = new Set([
            "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
            "0BSD", "Unlicense", "CC0-1.0", "BSL-1.0", "Unicode-3.0",
            "Unicode-DFS-2016", "MPL-2.0",
          ]);
          const groups = JSON.parse(readFileSync(process.argv[process.argv.length - 1], "utf8"));
          const licenses = Object.keys(groups);
          if (licenses.length === 0) {
            console.error("the production license listing came back empty");
            process.exit(1);
          }
          let rejected = 0;
          for (const license of licenses) {
            if (allowed.has(license)) continue;
            for (const pkg of groups[license]) {
              console.error(`${pkg.name} ${pkg.versions.join(",")}: ${license} is not on the allowlist`);
            }
            rejected += 1;
          }
          process.exit(rejected === 0 ? 0 : 1);
          CHECK
          printf '{"GPL-3.0-only":[{"name":"probe","versions":["1.0.0"]}]}' > "$RUNNER_TEMP/rejected.json"
          if node "$RUNNER_TEMP/licenses.mjs" "$RUNNER_TEMP/rejected.json" > /dev/null 2>&1; then
            echo "the license check accepted GPL-3.0-only"
            exit 1
          fi
          pnpm licenses list --prod --json > "$RUNNER_TEMP/licenses.json"
          node "$RUNNER_TEMP/licenses.mjs" "$RUNNER_TEMP/licenses.json"
      - name: parser peer range guard
        run: |
          range=$(node -p 'require("@typescript-eslint/parser/package.json").peerDependencies.typescript')
          native=$(node -p 'require("@typescript/native/package.json").version')
          aliased=$(node -p 'require("typescript/package.json").version')
          # The aliased version must match, so an empty result below is a real
          # answer rather than a range the tool could not read.
          if [ -z "$(pnpm exec semver -r "$range" "$aliased" || true)" ]; then
            echo "the parser peer range '$range' does not admit the aliased TypeScript $aliased"
            exit 1
          fi
          if [ -n "$(pnpm exec semver -r "$range" "$native" || true)" ]; then
            echo "the parser peer range $range admits TypeScript $native; the alias setup is ready to retire"
            exit 1
          fi

  build-macos:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build --workspace

  rust:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install the pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: install cargo-machete
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-machete
      - run: cargo machete

  hygiene:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "$HEAD_REF" | grep -Eq '^(feat|fix|docs|refactor|test|chore|perf|build|ci|revert)/[a-z0-9._-]+$' || {
            echo "the branch name '$HEAD_REF' does not follow the naming policy"
            exit 1
          }
      - name: reuse compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
      - name: license headers
        run: |
          check_headers() {
            failed=0
            while IFS= read -r file; do
              header=$(head -n 5 "$file")
              if ! printf '%s' "$header" | grep -q 'Copyright (C)' || ! printf '%s' "$header" | grep -qF 'SPDX-License-Identifier: AGPL-3.0-only' || ! printf '%s' "$header" | grep -q 'NOTICE'; then
                echo "$file: missing license header"
                failed=1
              fi
            done
            return "$failed"
          }
          printf 'export const bare = 1;\n' > "$RUNNER_TEMP/bare.ts"
          if printf '%s\n' "$RUNNER_TEMP/bare.ts" | check_headers > /dev/null; then
            echo "the header check accepted a file without a header"
            exit 1
          fi
          git ls-files 'apps/**' 'packages/**' 'crates/**' '*.mjs' | { grep -E '\.(ts|tsx|css|rs|html|mjs|cjs)$' || true; } > "$RUNNER_TEMP/sources.txt"
          [ -s "$RUNNER_TEMP/sources.txt" ] || { echo "the source glob matched nothing"; exit 1; }
          check_headers < "$RUNNER_TEMP/sources.txt"
      - name: source file ceiling
        run: |
          check_ceiling() {
            failed=0
            while IFS= read -r file; do
              lines=$(grep -cvE '^[[:space:]]*$' "$file") || true
              if [ "$lines" -gt "$FILE_LINE_CEILING" ]; then
                echo "$file: $lines lines exceeds the $FILE_LINE_CEILING line ceiling"
                failed=1
              fi
            done
            return "$failed"
          }
          seq 1 "$((FILE_LINE_CEILING + 5))" | sed 's/^/pub const FILLER/; s/$/: u32 = 0;/' > "$RUNNER_TEMP/oversized.rs"
          if printf '%s\n' "$RUNNER_TEMP/oversized.rs" | check_ceiling > /dev/null; then
            echo "the ceiling check accepted an oversized file"
            exit 1
          fi
          git ls-files 'crates/**/*.rs' 'apps/**/*.css' 'apps/**/*.html' 'packages/**/*.css' > "$RUNNER_TEMP/measured.txt"
          [ -s "$RUNNER_TEMP/measured.txt" ] || { echo "the ceiling glob matched nothing"; exit 1; }
          check_ceiling < "$RUNNER_TEMP/measured.txt"
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          if [ -n "$BASE_SHA" ]; then
            ./gitleaks git --no-banner --redact --log-opts="$BASE_SHA..HEAD"
          else
            ./gitleaks git --no-banner --redact
          fi

  contributor-gate:
    name: contributor gate
    # The workflow comes from main and nothing is checked out, so a pull
    # request can neither edit this job away nor run code here.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          check_author() {
            case "$1" in
              erickochen|renovate\[bot\]) return 0 ;;
            esac
            echo "pull requests from $1 are not accepted yet; external contributions open once the contributor agreement is in place"
            return 1
          }
          if check_author outsider > /dev/null; then
            echo "the contributor gate accepted a foreign author"
            exit 1
          fi
          check_author "$PR_AUTHOR"

  osv:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      # A fork pull request holds a read-only token, which cannot upload.
      upload-sarif: ${{ github.event.pull_request.head.repo.fork != true }}

  negative:
    name: gates fire on violations
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: oxlint complexity budgets
        run: |
          mkdir -p negative-samples
          node -e '
            const lines = ["export function tangled(a: number, b: number, c: number, d: number, e: number): number {"];
            lines.push("  let total = a + b + c + d + e;");
            for (let i = 0; i < 12; i += 1) lines.push("  if (total > " + String(i) + ") total += " + String(i) + ";");
            lines.push("  if (a > 0) {", "    if (b > 0) {", "      if (c > 0) {", "        if (d > 0) {", "          total += 1;", "        }", "      }", "    }", "  }");
            for (let i = 0; i < 40; i += 1) lines.push("  total += " + String(i) + ";");
            lines.push("  return total;", "}");
            require("fs").writeFileSync("negative-samples/tangled.ts", lines.join("\n") + "\n");
            const long = [];
            for (let i = 0; i < 401; i += 1) long.push("export const filler" + String(i) + " = " + String(i) + ";");
            require("fs").writeFileSync("negative-samples/long.ts", long.join("\n") + "\n");
          '
          if out=$(pnpm exec oxlint negative-samples 2>&1); then echo "oxlint accepted the samples"; exit 1; fi
          for rule in complexity max-depth max-lines-per-function max-params max-lines; do
            echo "$out" | grep -q "($rule)" || { echo "$rule did not fire"; exit 1; }
          done
          rm -rf negative-samples
      - name: eslint security and sonarjs
        run: |
          mkdir -p negative-samples
          node -e '
            const lines = ["export function risky(code: string, flags: number[]): unknown {", "  let verdict = 0;"];
            for (let i = 0; i < 13; i += 1) {
              lines.push("  for (const flag of flags) {", "    if (flag > " + String(i) + ") verdict += flag;", "  }");
            }
            lines.push("  if (verdict > 0) return eval(code);", "  return null;", "}");
            require("fs").writeFileSync("negative-samples/risky.ts", lines.join("\n") + "\n");
          '
          if out=$(pnpm exec eslint --max-warnings 0 negative-samples 2>&1); then echo "eslint accepted the sample"; exit 1; fi
          echo "$out" | grep -q "security/detect-eval-with-expression" || { echo "the security rule did not fire"; exit 1; }
          echo "$out" | grep -q "sonarjs/cognitive-complexity" || { echo "the sonarjs rule did not fire"; exit 1; }
          rm -rf negative-samples
      - name: stylelint logical properties
        run: |
          mkdir -p negative-samples
          printf '.probe {\n  margin-left: 4px;\n  text-align: left;\n}\n' > negative-samples/physical.css
          if out=$(pnpm exec stylelint negative-samples/physical.css 2>&1); then echo "stylelint accepted the sample"; exit 1; fi
          echo "$out" | grep -q "logical-css/require-logical-properties" || { echo "the logical properties rule did not fire"; exit 1; }
          echo "$out" | grep -q "logical-css/require-logical-keywords" || { echo "the logical keywords rule did not fire"; exit 1; }
          rm -rf negative-samples
      - name: stylelint raw values in component styles
        run: |
          mkdir -p negative-samples
          printf '.probe {\n  inline-size: 300px;\n  color: #123456;\n  background: white;\n  border-color: rgb(1 2 3);\n}\n\n@media (min-width: 500px) {\n  .probe {\n    display: none;\n  }\n}\n' > negative-samples/raw.module.css
          if out=$(pnpm exec stylelint --no-color negative-samples/raw.module.css 2>&1); then echo "stylelint accepted the sample"; exit 1; fi
          for rule in unit-disallowed-list color-no-hex color-named function-disallowed-list media-feature-name-value-allowed-list; do
            echo "$out" | grep -q " $rule\$" || { echo "$rule did not fire"; exit 1; }
          done
          rm -rf negative-samples
      - name: i18n catalog parity
        run: |
          node -e '
            const { readFileSync, writeFileSync } = require("fs");
            const path = "packages/i18n/messages/en.json";
            const catalog = JSON.parse(readFileSync(path, "utf8"));
            catalog.probe_only_en = "This key has no translation.";
            writeFileSync(path, JSON.stringify(catalog, null, 2) + "\n");
          '
          if out=$(pnpm --filter @huliho/i18n build 2>&1); then echo "the catalog gate accepted a missing translation"; exit 1; fi
          echo "$out" | grep -q "probe_only_en is missing" || { echo "the catalog gate failed for another reason"; exit 1; }
          git checkout -- packages/i18n/messages/en.json
      - name: reuse sample referencing an absent license
        run: |
          mkdir -p negative-samples
          printf '# SPDX-License-Identifier: MIT\nprobe\n' > negative-samples/probe.txt
      - name: reuse lint on the sample
        id: reuse-sample
        continue-on-error: true
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
      - name: reuse compliance fires
        env:
          OUTCOME: ${{ steps.reuse-sample.outcome }}
        run: |
          rm -rf negative-samples
          [ "$OUTCOME" = "failure" ] || { echo "reuse lint accepted a reference to an absent license"; exit 1; }
      - name: knip dead code
        run: |
          printf 'export const orphan = 1;\n' > packages/core/src/orphan.ts
          if out=$(pnpm knip 2>&1); then echo "knip accepted the orphan"; exit 1; fi
          echo "$out" | grep -q "Unused files" || { echo "knip failed for another reason"; exit 1; }
          echo "$out" | grep -q "orphan.ts" || { echo "knip did not name the orphan"; exit 1; }
          rm packages/core/src/orphan.ts
      - name: jscpd duplication
        run: |
          mkdir -p negative-samples
          node -e '
            const block = [];
            for (let i = 0; i < 20; i += 1) block.push("export const clone" + String(i) + " = " + String(i) + " + " + String(i) + ";");
            const text = block.join("\n") + "\n";
            require("fs").writeFileSync("negative-samples/one.ts", text);
            require("fs").writeFileSync("negative-samples/two.ts", text);
          '
          if out=$(pnpm exec jscpd negative-samples 2>&1); then echo "jscpd accepted the clones"; exit 1; fi
          echo "$out" | grep -q "found too many duplicates" || { echo "jscpd failed for another reason"; exit 1; }
          rm -rf negative-samples
      - name: size-limit budget
        run: |
          node -e '
            const bytes = require("crypto").randomBytes(300 * 1024).toString("base64");
            require("fs").writeFileSync("apps/web/dist/assets/oversized.js", "export const noise = \"" + bytes + "\";\n");
          '
          if out=$(pnpm size 2>&1); then echo "size-limit accepted the oversized bundle"; exit 1; fi
          echo "$out" | grep -q "size limit has exceeded" || { echo "size-limit failed for another reason"; exit 1; }
          rm apps/web/dist/assets/oversized.js
      - name: oxlint type-aware rules
        run: |
          printf 'export function probe(): void {\n  Promise.resolve(1).then(() => undefined);\n}\n' > packages/core/src/probe.ts
          if out=$(pnpm exec oxlint --type-aware packages/core/src/probe.ts 2>&1); then echo "the type-aware pass accepted the sample"; exit 1; fi
          echo "$out" | grep -q "(no-floating-promises)" || { echo "no-floating-promises did not fire"; exit 1; }
          rm packages/core/src/probe.ts
      - name: tsc type error
        run: |
          printf 'export const probe: number = "sample";\n' > packages/core/src/probe.ts
          if out=$(pnpm exec tsc -b 2>&1); then echo "the typecheck accepted the sample"; exit 1; fi
          echo "$out" | grep -q "error TS" || { echo "the type error did not fire"; exit 1; }
          rm packages/core/src/probe.ts
          pnpm exec tsc -b
      - name: vitest failing test
        run: |
          printf 'import { expect, test } from "vitest";\n\ntest("probe", () => {\n  expect(1).toBe(2);\n});\n' > apps/web/src/probe.test.ts
          if out=$(pnpm test 2>&1); then echo "the test gate accepted the failing test"; exit 1; fi
          echo "$out" | grep -q "1 failed" || { echo "the failing test did not fire"; exit 1; }
          rm apps/web/src/probe.test.ts
      - name: prettier formatting
        run: |
          mkdir -p negative-samples
          printf 'const  ugly=1\n' > negative-samples/ugly.ts
          if out=$(pnpm exec prettier --check negative-samples/ugly.ts 2>&1); then echo "prettier accepted the sample"; exit 1; fi
          echo "$out" | grep -q "Code style issues" || { echo "prettier failed for another reason"; exit 1; }
          rm -rf negative-samples
      - name: clippy budgets
        run: |
          rustup toolchain install > /dev/null
          dir="$RUNNER_TEMP/clippy-negative"
          mkdir -p "$dir/crates/probe/src"
          cp Cargo.toml clippy.toml rust-toolchain.toml "$dir/"
          printf '[package]\nname = "probe"\nversion = "0.0.0"\nedition.workspace = true\nlicense.workspace = true\nrepository.workspace = true\npublish = false\n\n[lints]\nworkspace = true\n' > "$dir/crates/probe/Cargo.toml"
          {
            printf 'pub fn wide(a: u32, b: u32, c: u32, d: u32, e: u32) -> u32 {\n    a + b + c + d + e\n}\n\n'
            printf 'pub fn endless() -> u32 {\n    let mut total = 0;\n'
            for i in $(seq 1 105); do printf '    total += %s;\n' "$i"; done
            printf '    total\n}\n\n'
            printf 'pub fn maze(x: u32) -> u32 {\n    let mut y = x;\n'
            for i in $(seq 1 26); do printf '    if y > %s {\n' "$i"; done
            printf '        y += 1;\n'
            for _ in $(seq 1 26); do printf '    }\n'; done
            printf '    y\n}\n'
          } > "$dir/crates/probe/src/lib.rs"
          if out=$(cd "$dir" && cargo clippy --workspace 2>&1); then echo "clippy accepted the samples"; exit 1; fi
          echo "$out" | grep -q "too many arguments" || { echo "too_many_arguments did not fire"; exit 1; }
          echo "$out" | grep -q "too many lines" || { echo "too_many_lines did not fire"; exit 1; }
          echo "$out" | grep -q "cognitive complexity" || { echo "cognitive_complexity did not fire"; exit 1; }
          echo "$out" | grep -q "must_use" || { echo "the pedantic set did not fire"; exit 1; }
      - name: install cargo-machete and cargo-deny
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-machete,cargo-deny
      - name: cargo-machete unused dependency
        run: |
          dir="$RUNNER_TEMP/machete-negative"
          mkdir -p "$dir/src"
          printf '[package]\nname = "probe"\nversion = "0.0.0"\nedition = "2024"\n\n[dependencies]\nserde = "1"\n' > "$dir/Cargo.toml"
          printf 'pub fn nothing() {}\n' > "$dir/src/lib.rs"
          if out=$(cargo machete "$dir" 2>&1); then echo "cargo-machete accepted the unused dependency"; exit 1; fi
          echo "$out" | grep -q "found the following unused dependencies" || { echo "cargo-machete failed for another reason"; exit 1; }
      - name: cargo fmt formatting
        run: |
          dir="$RUNNER_TEMP/fmt-negative"
          mkdir -p "$dir/src"
          cp rust-toolchain.toml "$dir/"
          printf '[package]\nname = "probe"\nversion = "0.0.0"\nedition = "2024"\n' > "$dir/Cargo.toml"
          printf 'pub fn wide( ) ->u32{1}\n' > "$dir/src/lib.rs"
          if out=$(cd "$dir" && cargo fmt --check 2>&1); then echo "cargo fmt accepted the sample"; exit 1; fi
          echo "$out" | grep -q "Diff in" || { echo "cargo fmt failed for another reason"; exit 1; }
      - name: cargo test failing test
        run: |
          dir="$RUNNER_TEMP/test-negative"
          mkdir -p "$dir/src"
          cp rust-toolchain.toml "$dir/"
          printf '[package]\nname = "probe"\nversion = "0.0.0"\nedition = "2024"\n' > "$dir/Cargo.toml"
          printf '#[cfg(test)]\nmod tests {\n    #[test]\n    fn probe() {\n        panic!("sample");\n    }\n}\n' > "$dir/src/lib.rs"
          if out=$(cd "$dir" && cargo test 2>&1); then echo "cargo test accepted the failing test"; exit 1; fi
          echo "$out" | grep -q "test result: FAILED" || { echo "the failing test did not fire"; exit 1; }
      - name: cargo-deny license allowlist
        run: |
          dir="$RUNNER_TEMP/deny-negative"
          mkdir -p "$dir/crates/probe/src"
          cp rust-toolchain.toml deny.toml "$dir/"
          printf '[workspace]\nresolver = "3"\nmembers = ["crates/*"]\n' > "$dir/Cargo.toml"
          printf '[package]\nname = "probe"\nversion = "0.0.0"\nedition = "2024"\nlicense = "GPL-3.0-only"\n' > "$dir/crates/probe/Cargo.toml"
          printf 'pub fn nothing() {}\n' > "$dir/crates/probe/src/lib.rs"
          if out=$(cd "$dir" && cargo deny check licenses 2>&1); then echo "cargo deny accepted the sample"; exit 1; fi
          echo "$out" | grep -q "GPL-3.0-only" || { echo "cargo deny failed for another reason"; exit 1; }

  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-audit
      - run: cargo audit
