# Local mail targets: Cyrus IMAP as the JMAP server and Dovecot for the
# IMAP bridge. The certs service writes one throwaway CA plus a server
# certificate for each and copies the CA to data/dev-certs/ca.pem.
#
#   docker compose -f docker-compose.dev.yml up -d --build
#
# A change to the content of one of the configs below does not change the
# service hash, so a container that is already up keeps the old content.
# After such a change recreate the containers:
#
#   docker compose -f docker-compose.dev.yml up -d --build --force-recreate
#
# Cyrus: JMAP over TLS on 8443, IMAPS on 9993, the user sanne@huliho.test
# with the password "password" and a storage quota of 1 GiB. Dovecot: IMAP
# with STARTTLS on 31143, IMAPS on 31993, submission on 31587, ManageSieve
# on 34190 and LMTP on 31024, any user with the password "password" and a
# quota of 1 GiB and 10000 messages. Its learn hook writes "spam" or "ham"
# with the Message-ID of every message copied or moved into Junk or moved
# out of it to /tmp/learned inside the container; a move from Junk to Trash
# writes nothing.

configs:
  certs-init:
    content: |
      set -eu
      cd /certs
      # Ten years: the certificates outlive any checkout.
      days=3650
      if [ ! -f ca.pem ]; then
        openssl req -x509 -noenc -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -days "$$days" -subj '/CN=Huliho dev CA' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' -keyout ca-key.pem -out ca.pem
        for name in cyrus dovecot; do
          openssl req -noenc -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -subj "/CN=$$name.huliho.test" -addext "subjectAltName=DNS:$$name.huliho.test,DNS:localhost,IP:127.0.0.1,IP:::1" -keyout "$$name-key.pem" -out "$$name.csr"
          openssl x509 -req -in "$$name.csr" -CA ca.pem -CAkey ca-key.pem -CAcreateserial -days "$$days" -copy_extensions copy -out "$$name.pem"
          rm "$$name.csr"
        done
        # Throwaway keys; both servers read them as unprivileged users.
        chmod 644 cyrus-key.pem dovecot-key.pem
      fi
      cp ca.pem /host/ca.pem

  imapd.conf:
    content: |
      configdirectory: /var/lib/cyrus
      partition-default: /var/spool/cyrus/mail
      servername: cyrus.huliho.test
      virtdomains: userid
      admins: cyrus@huliho.test
      sasl_pwcheck_method: auxprop
      sasl_auxprop_plugin: sasldb
      sasl_mech_list: PLAIN LOGIN
      # Lets cyradm sign in over the loopback listener; every published port is TLS.
      allowplaintext: 1
      conversations: 1
      httpmodules: jmap
      tls_server_cert: /certs/cyrus.pem
      tls_server_key: /certs/cyrus-key.pem
      tls_versions: tls1_2 tls1_3

  cyrus.conf:
    content: |
      START {
        recover cmd="ctl_cyrusdb -r"
      }
      SERVICES {
        # Plain IMAP on the loopback only, for cyradm in the entrypoint.
        imap cmd="imapd" listen="127.0.0.1:143" prefork=0
        imaps cmd="imapd -s" listen="993" prefork=0
        https cmd="httpd -s" listen="443" prefork=0
      }
      EVENTS {
        # Every 30 minutes and nightly at 04:01, the slots the packaged config uses.
        checkpoint cmd="ctl_cyrusdb -c" period=30
        tlsprune cmd="tls_prune" at=0401
      }

  cyrus-entrypoint:
    content: |
      set -eu
      printf '%s' password | saslpasswd2 -p -c -u huliho.test cyrus
      printf '%s' password | saslpasswd2 -p -c -u huliho.test sanne
      busybox syslogd -n -O - &
      /usr/sbin/cyrmaster -D &
      master=$!
      trap 'kill -TERM "$$master"' TERM INT
      admin() { TERM=dumb cyradm --user cyrus@huliho.test --password password --auth PLAIN --notls localhost; }
      until printf 'listmailbox user/*\n' | admin > /tmp/mailboxes 2> /dev/null; do kill -0 "$$master"; sleep 1; done
      grep -q 'user/sanne@huliho.test' /tmp/mailboxes || printf 'createmailbox user/sanne@huliho.test\n' | admin > /dev/null
      # A storage quota of one GiB, in the units of 1024 octets cyradm counts.
      quota_kib=1048576
      printf 'setquota user/sanne@huliho.test STORAGE %s\n' "$$quota_kib" | admin > /dev/null
      /usr/sbin/cyrus ctl_conversationsdb -b -r
      wait "$$master"

  dovecot-tls.conf:
    content: |
      ssl_server {
        cert_file = /certs/dovecot.pem
        key_file = /certs/dovecot-key.pem
      }

  dovecot-submission.conf:
    content: |
      # AUTH on the submission port needs a relay named. With the
      # capabilities fixed here the relay is first reached at MAIL FROM,
      # which the credential check never sends.
      submission_relay_host = 127.0.0.1
      submission_backend_capabilities = 8BITMIME PIPELINING SIZE

  dovecot-mailboxes.conf:
    content: |
      # The English defaults (Drafts, Junk, Sent and Trash with their
      # special-use attributes, created and subscribed on first login)
      # plus an Archive, which the defaults leave out.
      namespace inbox {
        @mailbox_defaults = english
        mailbox Archive {
          auto = subscribe
          special_use = \Archive
        }
      }

  dovecot-quota.conf:
    content: |
      # A quota per user of one GiB and ten thousand messages, reported
      # over IMAP QUOTA (RFC 9208).
      mail_plugins {
        quota = yes
      }
      protocol imap {
        mail_plugins {
          imap_quota = yes
        }
      }
      quota "User quota" {
        quota_storage_size = 1G
        quota_message_count = 10000
      }

  dovecot-learn.conf:
    content: |
      # The learn hook (RFC 6785): a message copied or moved into Junk runs
      # learn-spam, one that leaves Junk runs learn-ham. Both pipe the
      # message to the learn script. Each script keeps its compiled binary
      # in a directory of its own under /tmp/sieve-bin.
      sieve_plugins {
        sieve_imapsieve = yes
        sieve_extprograms = yes
      }
      sieve_global_extensions {
        vnd.dovecot.pipe = yes
      }
      sieve_pipe_bin_dir = /etc/dovecot/learn
      mailbox Junk {
        sieve_script learn-spam {
          type = before
          cause = copy
          path = /etc/dovecot/sieve/learn-spam.sieve
          bin_path = /tmp/sieve-bin/learn-spam
        }
      }
      imapsieve_from Junk {
        sieve_script learn-ham {
          type = before
          cause = copy
          path = /etc/dovecot/sieve/learn-ham.sieve
          bin_path = /tmp/sieve-bin/learn-ham
        }
      }

  dovecot-learn-spam.sieve:
    content: |
      require ["vnd.dovecot.pipe", "copy"];
      pipe :copy "learn" ["spam"];

  dovecot-learn-ham.sieve:
    content: |
      require ["vnd.dovecot.pipe", "copy", "imapsieve", "environment", "variables"];
      # A message that leaves Junk for Trash says nothing about spam.
      if environment :matches "imap.mailbox" "*" {
        set "mailbox" "$${1}";
      }
      if string "$${mailbox}" "Trash" {
        stop;
      }
      pipe :copy "learn" ["ham"];

  dovecot-learn:
    content: |
      #!/bin/sh
      # Appends the word it was given and the Message-ID of the message on
      # stdin to /tmp/learned. Plain sh: the image carries no other tools.
      cr=$$(printf '\r')
      id=
      while IFS= read -r line; do
        line=$${line%"$$cr"}
        case $$line in
          [Mm][Ee][Ss][Ss][Aa][Gg][Ee]-[Ii][Dd]:*) [ -n "$$id" ] || id=$${line#*:} ;;
        esac
      done
      printf '%s %s\n' "$$1" "$${id# }" >> /tmp/learned

services:
  certs:
    image: alpine/openssl:3.5.9
    entrypoint: ["sh", "/certs-init"]
    configs:
      - source: certs-init
        target: /certs-init
        mode: 0444
    volumes:
      - dev-certs:/certs
      - ./data/dev-certs:/host

  cyrus:
    build:
      dockerfile_inline: |
        FROM debian:trixie-slim
        RUN echo 'deb http://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/backports.list \
         && apt-get update \
         && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -t trixie-backports cyrus-imapd cyrus-caldav cyrus-admin sasl2-bin busybox \
         && rm -rf /var/lib/apt/lists/*
    entrypoint: ["sh", "/cyrus-entrypoint"]
    configs:
      - source: imapd.conf
        target: /etc/imapd.conf
        mode: 0444
      - source: cyrus.conf
        target: /etc/cyrus.conf
        mode: 0444
      - source: cyrus-entrypoint
        target: /cyrus-entrypoint
        mode: 0444
    volumes:
      - dev-certs:/certs:ro
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:9993:993"
    depends_on:
      certs:
        condition: service_completed_successfully

  dovecot:
    image: dovecot/dovecot:2.4.5
    environment:
      # The image's static passdb: any user, this one password.
      USER_PASSWORD: "{PLAIN}password"
    configs:
      - source: dovecot-tls.conf
        target: /etc/dovecot/conf.d/tls.conf
        mode: 0444
      - source: dovecot-submission.conf
        target: /etc/dovecot/conf.d/submission.conf
        mode: 0444
      - source: dovecot-mailboxes.conf
        target: /etc/dovecot/conf.d/mailboxes.conf
        mode: 0444
      - source: dovecot-quota.conf
        target: /etc/dovecot/conf.d/quota.conf
        mode: 0444
      - source: dovecot-learn.conf
        target: /etc/dovecot/conf.d/learn.conf
        mode: 0444
      # The directory for a script's compiled binary takes its mode from
      # the script file, so these two are writable for their owner.
      - source: dovecot-learn-spam.sieve
        target: /etc/dovecot/sieve/learn-spam.sieve
        mode: 0644
      - source: dovecot-learn-ham.sieve
        target: /etc/dovecot/sieve/learn-ham.sieve
        mode: 0644
      - source: dovecot-learn
        target: /etc/dovecot/learn/learn
        mode: 0555
    volumes:
      - dev-certs:/certs:ro
      - dovecot-mail:/srv/vmail
    ports:
      - "127.0.0.1:31143:31143"
      - "127.0.0.1:31993:31993"
      - "127.0.0.1:31587:31587"
      - "127.0.0.1:34190:34190"
      - "127.0.0.1:31024:31024"
    depends_on:
      certs:
        condition: service_completed_successfully

volumes:
  dev-certs:
  dovecot-mail:
