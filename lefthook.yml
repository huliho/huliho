# Git hooks. Managed by lefthook (evilmartians/lefthook).
# Installed on every clone by the pnpm prepare script (lefthook install).
# Bypassing hooks (--no-verify) is forbidden; CI re-runs every check anyway.

pre-commit:
  parallel: true
  commands:
    branch-name:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        [ "$branch" = "HEAD" ] && exit 0
        echo "$branch" | grep -Eq '^(feat|fix|docs|refactor|test|chore|perf|build|ci|revert)/[a-z0-9._-]+$' || { echo "Branch name '$branch' violates branch naming policy"; exit 1; }
    ts-lint:
      glob: "*.{ts,tsx}"
      run: pnpm oxlint --deny-warnings {staged_files} && pnpm eslint --max-warnings 0 {staged_files}
    css-lint:
      glob: "*.css"
      run: pnpm stylelint {staged_files}
    format:
      glob: "*.{ts,tsx,mjs,cjs,json,md,yml,yaml,css,html}"
      run: pnpm prettier --check {staged_files}
    headers:
      glob: "{*.mjs,{apps,packages,crates}/**/*.{ts,tsx,css,rs,html,mjs,cjs}}"
      run: |
        failed=0
        for file in {staged_files}; do
          header=$(head -n 5 "$file")
          printf '%s' "$header" | grep -q 'Copyright (C)' && printf '%s' "$header" | grep -qF 'SPDX-License-Identifier: AGPL-3.0-only' && printf '%s' "$header" | grep -q 'NOTICE' || { echo "$file: missing license header"; failed=1; }
        done
        exit "$failed"
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --check
    secrets:
      run: gitleaks git --pre-commit --staged --no-banner

pre-push:
  commands:
    build:
      priority: 1
      run: pnpm build
    ts-lint:
      priority: 2
      run: pnpm lint
    ts-typecheck:
      priority: 2
      run: pnpm typecheck
    dead-code:
      priority: 2
      run: pnpm knip
    rust-clippy:
      priority: 2
      run: cargo clippy --workspace --all-targets -- -D warnings
    tests:
      priority: 3
      run: pnpm test && cargo test --workspace
