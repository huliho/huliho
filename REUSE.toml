version = 1
SPDX-PackageName = "Huliho"
SPDX-PackageSupplier = "Person: Eric Kochen"
SPDX-PackageDownloadLocation = "https://github.com/huliho/huliho"

[[annotations]]
path = [
  ".gitignore",
  ".nvmrc",
  ".prettierignore",
  "NOTICE",
  "**/*.json",
  "**/*.json5",
  "**/*.lock",
  "**/*.md",
  "**/*.png",
  "**/*.stderr",
  "**/*.toml",
  "**/*.txt",
  "**/*.yaml",
  "**/*.yml",
]
SPDX-FileCopyrightText = "Copyright (C) 2026 Eric Kochen"
SPDX-License-Identifier = "AGPL-3.0-only"

# These files quote license lines in code; the table is their only source.
[[annotations]]
path = [
  ".github/workflows/ci.yml",
  "lefthook.yml",
  "apps/web/e2e/session.spec.ts",
  "apps/web/src/legal/legal-notices.tsx",
  "apps/web/src/legal/legal-notices.test.tsx",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) 2026 Eric Kochen"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = [
  "apps/web/src/assets/fonts/hanken-grotesk-*.woff2",
  "apps/web/src/assets/fonts/OFL-hanken-grotesk.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2021 The Hanken Grotesk Project Authors (https://github.com/marcologous/hanken-grotesk)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  "apps/web/src/assets/fonts/ibm-plex-mono-*.woff2",
  "apps/web/src/assets/fonts/OFL-ibm-plex-mono.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright © 2017 IBM Corp. with Reserved Font Name \"Plex\""
SPDX-License-Identifier = "OFL-1.1"
